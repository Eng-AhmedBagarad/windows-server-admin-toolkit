name: Pester Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester 5.7.1
        shell: powershell
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable Pester | Select-Object Name, Version

      - name: Run Pester test suite
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -Output Normal
